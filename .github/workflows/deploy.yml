on: push
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/zola'
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install citation processor
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Prepare Markdown, equations, and citations
        run: python3 -B themes/persona/scripts/persona.py prepare --root . --output .persona-build
      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          BUILD_DIR: .persona-build
          BUILD_THEMES: false
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
